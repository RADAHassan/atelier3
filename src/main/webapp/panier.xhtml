<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets">
<h:head>
  <title>Mon panier</title>
  <h:outputStylesheet library="css" name="style.css"/>
</h:head>
<h:body>
  <ui:include src="/menu.xhtml"/>
  <div class="container">
    <h2>Mon panier</h2>
    <h:panelGroup rendered="#{not internauteBean.connecte}">
      <p>Veuillez vous <h:link outcome="connexion" value="connecter"/> pour voir votre panier.</p>
    </h:panelGroup>
    <h:form rendered="#{internauteBean.connecte}">
      <h:panelGroup rendered="#{empty panierBean.lignes}"><p>Votre panier est vide.</p></h:panelGroup>
      <h:dataTable value="#{panierBean.lignes}" var="l" rendered="#{not empty panierBean.lignes}">
        <h:column><f:facet name="header">Produit</f:facet>#{l.produit.nom}</h:column>
        <h:column><f:facet name="header">Prix unitaire</f:facet>
          <h:outputText value="#{l.produit.prix}"><f:convertNumber minFractionDigits="2"/></h:outputText>
        </h:column>
        <h:column><f:facet name="header">Quantite</f:facet>#{l.quantite}</h:column>
        <h:column><f:facet name="header">Sous-total</f:facet>
          <h:outputText value="#{l.sousTotal}"><f:convertNumber minFractionDigits="2"/></h:outputText>
        </h:column>
        <h:column><h:commandButton value="Retirer" styleClass="btn" action="#{panierBean.retirer(l.id)}"/></h:column>
      </h:dataTable>
      <h:panelGroup rendered="#{not empty panierBean.lignes}">
        <h3>Total :
          <h:outputText value="#{panierBean.total}"><f:convertNumber minFractionDigits="2"/></h:outputText> MAD
        </h3>
        <h:commandButton value="Vider le panier" styleClass="btn" action="#{panierBean.vider}"/>
      </h:panelGroup>
    </h:form>
  </div>
</h:body>
</html>
