<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets">
<h:head>
  <title>Connexion</title>
  <h:outputStylesheet library="css" name="style.css"/>
</h:head>
<h:body>
  <ui:include src="/menu.xhtml"/>
  <div class="container">
    <h2>Connexion</h2>
    <h:messages errorClass="msg-error"/>
    <h:form>
      <h:panelGrid columns="2" styleClass="form">
        <h:outputLabel for="email" value="Email"/>
        <h:inputText id="email" value="#{internauteBean.email}" required="true"/>
        <h:outputLabel for="mdp" value="Mot de passe"/>
        <h:inputSecret id="mdp" value="#{internauteBean.motDePasse}" required="true"/>
        <h:commandButton value="Se connecter" action="#{internauteBean.connecter}"/>
      </h:panelGrid>
    </h:form>
  </div>
</h:body>
</html>
