<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets">
<h:head>
  <title>Vitrine</title>
  <h:outputStylesheet library="css" name="style.css"/>
</h:head>
<h:body>
  <ui:include src="/menu.xhtml"/>
  <div class="container">
    <h:messages styleClass="msg-info" errorClass="msg-error" infoClass="msg-info"/>
    <ui:repeat value="#{vitrineBean.vitrines}" var="v">
      <h2>#{v.titre}</h2>
      <h:form>
        <div class="grid">
          <ui:repeat value="#{v.produits}" var="p">
            <div class="card">
              <h3>#{p.nom}</h3>
              <p>#{p.description}</p>
              <p><small>Categorie : #{p.categorie.nom} - Stock : #{p.stock}</small></p>
              <p class="prix">
                <h:outputText value="#{p.prix}"><f:convertNumber minFractionDigits="2"/></h:outputText> MAD
              </p>
              <h:commandButton value="Ajouter au panier" styleClass="btn"
                               action="#{panierBean.ajouter(p.id)}" disabled="#{p.stock le 0}"/>
            </div>
          </ui:repeat>
        </div>
      </h:form>
    </ui:repeat>
  </div>
</h:body>
</html>
